<svg width="1200" height="26" viewBox="0 0 1200 26" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Section Divider</title>
  <desc id="desc">Subtle animated futuristic divider line.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="26" fill="#0d1117"/>
  <rect x="0" y="12" width="1200" height="1.2" fill="#1f2937"/>
  <rect x="-300" y="11.2" width="280" height="2.8" fill="url(#g)">
    <animate attributeName="x" from="-300" to="1220" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>

<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rishabh Patel Hero Banner</title>
  <desc id="desc">Animated dark hero banner with Full-Stack, AI, Automation, and Systems labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050607"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="320" fill="#000000" opacity="0.24"/>

  <g opacity="0.26">
    <path d="M0 64H1200M0 128H1200M0 192H1200M0 256H1200" stroke="#1f2937"/>
    <path d="M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320" stroke="#111827"/>
  </g>

  <rect x="-400" y="88" width="420" height="1.5" fill="url(#line)">
    <animate attributeName="x" from="-400" to="1240" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="-380" y="230" width="360" height="1.2" fill="url(#line)" opacity="0.55">
    <animate attributeName="x" from="-380" to="1240" dur="8.5s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#f3f4f6" text-anchor="middle">
    <text x="600" y="140" font-size="44" font-weight="700" letter-spacing="3">FULL-STACK · AI · AUTOMATION</text>
    <text x="600" y="184" font-size="24" fill="#9ca3af" letter-spacing="7">SYSTEMS</text>
  </g>
</svg>

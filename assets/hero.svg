<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Futuristic animated hero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060606"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="160" x2="1200" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A1010">
        <animate attributeName="stop-color" values="#7A1010;#B91C1C;#7A1010" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#E11D48">
        <animate attributeName="stop-color" values="#E11D48;#991B1B;#E11D48" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)" rx="14"/>

  <g opacity="0.14" stroke="#ffffff" stroke-width="0.6">
    <path d="M0 40H1200"/><path d="M0 80H1200"/><path d="M0 120H1200"/><path d="M0 160H1200"/><path d="M0 200H1200"/><path d="M0 240H1200"/><path d="M0 280H1200"/>
    <path d="M100 0V320"/><path d="M200 0V320"/><path d="M300 0V320"/><path d="M400 0V320"/><path d="M500 0V320"/><path d="M600 0V320"/><path d="M700 0V320"/><path d="M800 0V320"/><path d="M900 0V320"/><path d="M1000 0V320"/><path d="M1100 0V320"/>
  </g>

  <path d="M0 250C150 200 250 290 400 240C550 190 650 280 800 235C950 190 1050 250 1200 220" stroke="url(#accent)" stroke-width="2" filter="url(#glow)">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0 250C150 200 250 290 400 240C550 190 650 280 800 235C950 190 1050 250 1200 220;
              M0 235C150 185 250 275 400 225C550 205 650 260 800 220C950 210 1050 230 1200 205;
              M0 250C150 200 250 290 400 240C550 190 650 280 800 235C950 190 1050 250 1200 220"/>
  </path>

  <g fill="#ef4444" opacity="0.8">
    <circle cx="140" cy="90" r="3"><animate attributeName="cy" values="90;70;90" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="70" r="3"><animate attributeName="cy" values="70;95;70" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="250" r="2.5"><animate attributeName="cx" values="940;980;940" dur="7s" repeatCount="indefinite"/></circle>
  </g>

  <text x="70" y="130" fill="#F9FAFB" font-size="42" font-weight="700" font-family="Segoe UI, Arial, sans-serif">RISHABH PATEL</text>
  <text x="70" y="170" fill="#FCA5A5" font-size="22" font-weight="500" font-family="Segoe UI, Arial, sans-serif">Full-Stack Developer | AI &amp; Automation Builder</text>
  <text x="70" y="210" fill="#D1D5DB" font-size="17" font-family="Segoe UI, Arial, sans-serif">Building modern web applications, intelligent AI tools, and automation systems.</text>
</svg>

<svg width="1200" height="90" viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated typing-style role lines">
  <rect width="1200" height="90" rx="10" fill="#0b0b0b"/>
  <text x="28" y="56" fill="#f3f4f6" font-family="Consolas, Monaco, monospace" font-size="24">&gt; <tspan fill="#f87171">Full-Stack Developer</tspan>
    <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.18;0.2;0.98;1" dur="15s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="56" fill="#f3f4f6" font-family="Consolas, Monaco, monospace" font-size="24" opacity="0">&gt; <tspan fill="#f87171">AI &amp; Automation Builder</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.21;0.38;0.4;1" dur="15s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="56" fill="#f3f4f6" font-family="Consolas, Monaco, monospace" font-size="24" opacity="0">&gt; <tspan fill="#f87171">MERN Stack Developer</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.41;0.58;0.6;1" dur="15s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="56" fill="#f3f4f6" font-family="Consolas, Monaco, monospace" font-size="24" opacity="0">&gt; <tspan fill="#f87171">Problem Solver</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.61;0.78;0.8;1" dur="15s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="56" fill="#f3f4f6" font-family="Consolas, Monaco, monospace" font-size="24" opacity="0">&gt; <tspan fill="#f87171">Building the Future with Code</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.81;1" dur="15s" repeatCount="indefinite"/>
  </text>
  <rect x="520" y="38" width="8" height="24" fill="#f87171">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>

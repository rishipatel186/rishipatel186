<svg width="1200" height="190" viewBox="0 0 1200 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal style animated development philosophy">
  <rect x="0" y="0" width="1200" height="190" rx="12" fill="#0d0d0d"/>
  <rect x="0" y="0" width="1200" height="28" rx="12" fill="#171717"/>
  <circle cx="20" cy="14" r="5" fill="#ef4444"/>
  <circle cx="40" cy="14" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="14" r="5" fill="#10b981"/>

  <text x="26" y="64" fill="#e5e7eb" font-size="24" font-family="Consolas, Monaco, monospace">$ Build.</text>
  <text x="26" y="90" fill="#e5e7eb" font-size="24" font-family="Consolas, Monaco, monospace">$ Break.</text>
  <text x="26" y="116" fill="#e5e7eb" font-size="24" font-family="Consolas, Monaco, monospace">$ Debug.</text>
  <text x="26" y="142" fill="#e5e7eb" font-size="24" font-family="Consolas, Monaco, monospace">$ Learn.</text>
  <text x="26" y="168" fill="#fca5a5" font-size="24" font-family="Consolas, Monaco, monospace">$ Improve. Repeat.</text>

  <rect x="290" y="148" width="10" height="20" fill="#f87171">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
